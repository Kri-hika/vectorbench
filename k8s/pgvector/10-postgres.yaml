# Postgres with the pgvector extension. A StatefulSet, because the database owns persistent state:
# its pod keeps a stable name and its own volume across restarts.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: vectorbench-pg
type: Opaque
stringData:
  username: vectorbench
  password: change-me-for-anything-but-a-local-cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vectorbench-pg
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: vectorbench
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
            - name: PGDATA                    # subdirectory: a fresh volume's lost+found breaks initdb
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d vectorbench"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d vectorbench"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vectorbench-pg
spec:
  selector: {app: postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
