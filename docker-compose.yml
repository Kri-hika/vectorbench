services:
  api:
    build: .
    container_name: vectorbench-api
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/app/docs
      # A directory mount: binding ./kb.db directly made Docker create a *directory* named kb.db
      # when the file did not exist yet, and the index then failed to open.
      - ./data:/app/data
    environment:
      - VB_DB_PATH=/app/data/kb.db
      - VB_DOCS_DIR=/app/docs
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: vectorbench-frontend
    depends_on:
      api:
        condition: service_healthy   # Dockerfile HEALTHCHECK polls /health
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
